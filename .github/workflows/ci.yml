# Runs every check on every push and pull request. Vercel also runs the fast checks (scripts/check.sh)
# before each deploy and refuses to deploy on failure; this adds the server tests, which need a
# database.
name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Typecheck and game test suites
    runs-on: ubuntu-24.04
    # npm run check is about 9 minutes on a runner; the extra is headroom, not room to grow into.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/thrash-margin/client/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: packages/thrash-margin/client
      - run: npm run check

  tours:
    name: Tutorials played in a browser
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/thrash-margin/client/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: packages/thrash-margin/client
      # Playwright is installed globally rather than added to the repo: only this job needs it, and
      # scripts/tours/run.mjs resolves it from the global install.
      - run: npm install -g playwright@1.63.0 && npx -y playwright@1.63.0 install --with-deps chromium
      - run: npm run tours -- --quick
        env:
          TOUR_OUT: ${{ runner.temp }}/tours
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tour-failures
          path: ${{ runner.temp }}/tours

  api:
    name: Server tests against a Supabase-shaped Postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The runner's preinstalled PostgreSQL ships with SSL on, which the API's connection requires
      # (packages/*/api/_lib/db.ts), so no extra setup is needed for it.
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
      - run: npm run test:api
        env:
          API_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
