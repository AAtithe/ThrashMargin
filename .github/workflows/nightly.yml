# The deep tier, every night: npm run check:deep runs Fireline's heaviest whole-battle sections,
# which npm run check (every push, every deploy) leaves out to stay fast. See CLAUDE.md.
name: Nightly deep checks

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

jobs:
  deep:
    name: Every game test suite, the deep tier
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/thrash-margin/client/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: packages/thrash-margin/client
      - run: npm run check:deep
