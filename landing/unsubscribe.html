<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unsubscribe</title>
    <script src="/theme-init.js"></script>
    <style>
      :root { --ground: #f4f1ea; --card: #ffffff; --ink: #14151a; --soft: #5b616b; --rule: #e0dbd0; --accent: #a8843f; --good: #2f7d4f; --bad: #b8322a; }
      :root[data-theme='dark'] { --ground: #0f1013; --card: #17181d; --ink: #eceae4; --soft: #9aa0aa; --rule: #2a2d35; --accent: #c9a45a; --good: #5fbf85; --bad: #e0675f; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
             background: var(--ground); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .card { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 40px 32px; max-width: 440px; width: 100%; text-align: center; }
      .mark { font-family: Georgia, 'Times New Roman', serif; letter-spacing: 3px; text-transform: uppercase; font-size: 13px; color: var(--accent); margin-bottom: 18px; }
      h1 { font-family: Georgia, 'Times New Roman', serif; font-weight: normal; font-size: 28px; margin: 0 0 12px; }
      p { color: var(--soft); line-height: 1.55; margin: 0 0 16px; font-size: 15px; }
      p.ok { color: var(--good); } p.bad { color: var(--bad); }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">News from the portal</div>
      <h1>Unsubscribe</h1>
      <p id="status" role="status">Turning off news emails&hellip;</p>
      <p>You can turn them back on at any time from your <a href="/thrash-margin/profile">Profile page</a>.</p>
    </main>
    <script src="/unsubscribe.js"></script>
  </body>
</html>
